version: 2
updates:
  # Enable version updates for npm packages in the root directory
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 10
    # Group updates together to minimize pull request noise
    groups:
      dependencies:
        applies-to: version-updates
        # Keep broad updates limited to compatible minor and patch releases.
        # Major upgrades need an isolated review because they can change the
        # React/Vite/ESLint toolchain contract and break CI before Vercel builds.
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Enable version updates for npm packages in the /scripts directory
  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
    groups:
      dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Enable version updates for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
