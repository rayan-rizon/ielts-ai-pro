name: CI

on:
  push:
    branches: ['main', 'master', 'develop']
  pull_request:

# Prevent multiple builds from running on the same branch at once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint (errors only)
        run: npx eslint src --quiet

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Start Preview Server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          echo $! > preview.pid
          # Wait for server to be ready
          npx wait-on http://127.0.0.1:4173 --timeout 30000

      - name: Accessibility Smoke
        run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 npx playwright test tests/accessibility.spec.js --project=chromium --reporter=line

      - name: Performance Smoke
        run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 npx playwright test tests/performance/performance-metrics.spec.js --config=playwright.perf.config.ts --project=chromium --reporter=line

      - name: Lighthouse Gate (non-blocking)
        continue-on-error: true
        run: |
          npm run perf:lighthouse:mobile
          npm run perf:lighthouse:desktop
          npm run perf:lighthouse:assert

      - name: Stop Preview Server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)" || true
          fi

      - name: Upload Accessibility Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: accessibility-reports/
          if-no-files-found: ignore

      - name: Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouse/
          if-no-files-found: ignore

