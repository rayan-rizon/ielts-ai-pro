name: CI

on:
  push:
    branches: ['main', 'master', 'develop']
  pull_request:

# Prevent multiple builds from running on the same branch at once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint (errors only)
        run: npx eslint src --quiet

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build
