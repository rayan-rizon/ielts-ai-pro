<svg xmlns="http://www.w3.org/2000/svg"
  width="72" height="72" viewBox="0 0 72 72"
  fill="none" role="img" aria-labelledby="logoTitle logoDesc"
  shape-rendering="geometricPrecision">
  <title id="logoTitle">Animated IELTS AI Pro Monogram</title>
  <desc id="logoDesc">A subtly animated ascending A monogram with a purple upward slash.</desc>

  <defs>
    <linearGradient id="slashGradient" x1="198" y1="154" x2="316" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C4CFF"/>
      <stop offset="1" stop-color="#A977FF"/>
    </linearGradient>
    <linearGradient id="legGradient" x1="235" y1="155" x2="305" y2="253" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A977FF"/>
      <stop offset="0.55" stop-color="#7D55FF"/>
      <stop offset="1" stop-color="#6C4CFF"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0.50 0 0 0 0.18
                0 0.30 0 0 0.08
                0 0 0.95 0 0.55
                0 0 0 0.30 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .logo-motion {
      transform-box: fill-box;
      transform-origin: center;
      animation:
        logo-in 700ms cubic-bezier(.2,.8,.2,1) both,
        logo-float 4s ease-in-out 1.1s infinite;
    }

    .purple-leg {
      transform-box: fill-box;
      transform-origin: center;
      animation: leg-pulse 3.2s ease-in-out 1.1s infinite;
    }

    .upward-slash {
      transform-box: fill-box;
      transform-origin: left center;
      filter: url(#softGlow);
      animation:
        slash-in 850ms cubic-bezier(.16,1,.3,1) 180ms both,
        slash-breathe 3.2s ease-in-out 1.2s infinite;
    }

    @keyframes logo-in {
      0% { opacity: 0; transform: translateY(4px) scale(.93); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes slash-in {
      0% { opacity: 0; transform: translate(-18px, 12px) scaleX(.45) rotate(-3deg); }
      100% { opacity: 1; transform: translate(0, 0) scaleX(1) rotate(0deg); }
    }

    @keyframes logo-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.2px); }
    }

    @keyframes leg-pulse {
      0%, 100% { opacity: 1; transform: translateY(0); }
      50% { opacity: .92; transform: translateY(-.8px); }
    }

    @keyframes slash-breathe {
      0%, 100% { opacity: .96; transform: translate(0, 0) scaleX(1); }
      50% { opacity: 1; transform: translate(1.2px, -1px) scaleX(1.035); }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-motion,
      .purple-leg,
      .upward-slash {
        animation: none;
      }
    }
  </style>

  <g transform="translate(5 5) scale(0.24137931) translate(-55 -21)">
    <g class="logo-motion">
      <path d="M211 21 L160 22 L55 252 L125 252 L207 173 L195 146 L151 173 L145 174 L185 82 L205 127 L249 103 Z"
        fill="#0B0E2A"/>
      <path class="purple-leg"
        d="M265 139 L223 179 L257 253 L316 253 L311 238 Z"
        fill="url(#legGradient)"/>
      <path class="upward-slash"
        d="M316 74 L198 144 L198 149 L208 172 Z"
        fill="url(#slashGradient)"/>
    </g>
  </g>
</svg>