<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">IELTS Reading sentence completion four checks</title>
  <desc id="description">A four-step check for grammar, passage location, meaning, and the answer word limit.</desc>
  <defs>
    <filter id="paper-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="25"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect width="1200" height="675" rx="28" fill="#fbfffd"/>
  <rect width="1200" height="675" rx="28" filter="url(#paper-noise)" opacity=".06"/>
  <circle cx="1068" cy="105" r="60" fill="#e5e1ff"/>
  <circle cx="104" cy="580" r="68" fill="#d5f8e8"/>

  <text x="600" y="91" text-anchor="middle" fill="#29235f" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">Sentence Completion: Four Checks</text>
  <text x="600" y="135" text-anchor="middle" fill="#62657a" font-family="Arial, Helvetica, sans-serif" font-size="22">Choose an answer that fits the passage, the sentence, and the instruction.</text>

  <path d="M305 342H344M586 342H624M866 342H905" stroke="#6759df" stroke-width="5"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="219" width="241" height="247" rx="24" fill="#fff" stroke="#c6b8f7" stroke-width="3"/>
    <circle cx="185" cy="276" r="31" fill="#ece8ff"/>
    <text x="185" y="286" text-anchor="middle" fill="#5646d8" font-size="28" font-weight="700">1</text>
    <text x="185" y="340" text-anchor="middle" fill="#29235f" font-size="27" font-weight="700">GRAMMAR</text>
    <text x="185" y="381" text-anchor="middle" fill="#62657a" font-size="18">What part of speech</text>
    <text x="185" y="409" text-anchor="middle" fill="#62657a" font-size="18">fits the gap?</text>

    <rect x="344" y="219" width="242" height="247" rx="24" fill="#fff" stroke="#a9efd3" stroke-width="3"/>
    <circle cx="465" cy="276" r="31" fill="#d0fae8"/>
    <text x="465" y="286" text-anchor="middle" fill="#08745d" font-size="28" font-weight="700">2</text>
    <text x="465" y="340" text-anchor="middle" fill="#29235f" font-size="27" font-weight="700">LOCATE</text>
    <text x="465" y="381" text-anchor="middle" fill="#62657a" font-size="18">Find the matching</text>
    <text x="465" y="409" text-anchor="middle" fill="#62657a" font-size="18">idea in the passage.</text>

    <rect x="624" y="219" width="242" height="247" rx="24" fill="#fff" stroke="#c6b8f7" stroke-width="3"/>
    <circle cx="745" cy="276" r="31" fill="#ece8ff"/>
    <text x="745" y="286" text-anchor="middle" fill="#5646d8" font-size="28" font-weight="700">3</text>
    <text x="745" y="340" text-anchor="middle" fill="#29235f" font-size="27" font-weight="700">MEANING</text>
    <text x="745" y="381" text-anchor="middle" fill="#62657a" font-size="18">Does the exact word</text>
    <text x="745" y="409" text-anchor="middle" fill="#62657a" font-size="18">complete the idea?</text>

    <rect x="905" y="219" width="241" height="247" rx="24" fill="#fff" stroke="#a9efd3" stroke-width="3"/>
    <circle cx="1025" cy="276" r="31" fill="#d0fae8"/>
    <text x="1025" y="286" text-anchor="middle" fill="#08745d" font-size="28" font-weight="700">4</text>
    <text x="1025" y="340" text-anchor="middle" fill="#29235f" font-size="27" font-weight="700">WORD LIMIT</text>
    <text x="1025" y="381" text-anchor="middle" fill="#62657a" font-size="18">Does the final answer</text>
    <text x="1025" y="409" text-anchor="middle" fill="#62657a" font-size="18">obey the instruction?</text>

    <rect x="185" y="530" width="830" height="80" rx="22" fill="#29235f"/>
    <text x="600" y="566" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">FINAL READ-THROUGH</text>
    <text x="600" y="594" text-anchor="middle" fill="#d6f7e9" font-size="18" font-weight="700">Read the completed sentence once: grammar and meaning must both sound complete.</text>
  </g>

  <g aria-label="Brand watermark">
    <rect x="1020" y="631" width="180" height="44" fill="#3730a3" fill-opacity=".72"/>
    <text x="1110" y="659" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">IELTS Ai Pro</text>
  </g>
</svg>
