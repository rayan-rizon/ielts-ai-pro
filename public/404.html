<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://www.ieltsai.pro/404" />
    <title>Page Not Found | IELTS Ai Pro</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          'Plus Jakarta Sans',
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f8f7ff;
        color: #0f172a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% 12%, rgba(124, 58, 237, 0.14), transparent 34rem),
          radial-gradient(circle at 82% 88%, rgba(37, 99, 235, 0.1), transparent 30rem), #f8f7ff;
      }
      main {
        width: min(680px, 100%);
        padding: clamp(32px, 7vw, 64px);
        text-align: center;
        border: 1px solid rgba(99, 102, 241, 0.18);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 28px 80px -44px rgba(49, 46, 129, 0.55);
      }
      .eyebrow {
        margin: 0 0 14px;
        color: #6256ef;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1;
      }
      p {
        margin: 20px auto 0;
        max-width: 520px;
        color: #526079;
        line-height: 1.7;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 30px;
      }
      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 18px;
        border-radius: 12px;
        color: #ffffff;
        background: #6256ef;
        font-weight: 800;
        text-decoration: none;
      }
      a.secondary {
        color: #312e81;
        background: #eef2ff;
      }
      a:focus-visible {
        outline: 3px solid #a78bfa;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #08080a;
          color: #f8fafc;
        }
        body {
          background: radial-gradient(circle at 50% 20%, #211b3d, #08080a 55%);
        }
        main {
          border-color: rgba(167, 139, 250, 0.25);
          background: rgba(15, 23, 42, 0.92);
        }
        p {
          color: #cbd5e1;
        }
        a.secondary {
          color: #ddd6fe;
          background: #292342;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>Page not found</h1>
      <p>
        This page may have moved or no longer exists. Continue with a public IELTS practice tool or
        return to the homepage.
      </p>
      <nav aria-label="Helpful links">
        <a href="/">Go to homepage</a>
        <a class="secondary" href="/ielts-writing-checker">Writing checker</a>
        <a class="secondary" href="/blog">IELTS guides</a>
      </nav>
    </main>
  </body>
</html>
